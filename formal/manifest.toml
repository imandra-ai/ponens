# Single source of truth for the ponens formal-model collection.
#
# `check.sh` reads this, runs `codelogician-lite check` on each [[model]] file, and
# compares the proof obligation count with `pos`. The README is kept in sync with it.
#
# The framework is one state machine whose state is the trace. machine/ holds the state,
# its transitions and the queries over it; machine/pipeline/ holds models of the procedures
# that produce artifacts. Checking a file also checks what it imports, but `pos` counts
# only the file's own POs, so the counts add up to `total_pos`.
#
# Fields: path, title, pos (expected POs, all proved).

version = 5
total_pos = 246

[[model]]
path = "machine/core.iml"
title = "Core: Artifact, Trace (wf, extend, supersede, closure), State (wf_state)"
pos = 81

[[model]]
path = "machine/freshness.iml"
title = "Freshness (I4), a derived query"
pos = 9

[[model]]
path = "machine/goals.iml"
title = "Goals: the met axis, progress"
pos = 20

[[model]]
path = "machine/policy.iml"
title = "Policy: the governed axis, LTLf G and F"
pos = 6

[[model]]
path = "machine/axes.iml"
title = "Governed and met are independent"
pos = 2

[[model]]
path = "machine/reuse.iml"
title = "Reuse (I5), decision and transition"
pos = 7

[[model]]
path = "machine/merge.iml"
title = "Merge: classify, merge with a shared base, merge_state"
pos = 58

[[model]]
path = "machine/top.iml"
title = "Top: the machine, its invariant, every run is well-formed"
pos = 11

[[model]]
path = "machine/pipeline/identity.iml"
title = "Component identity: never conflate, aliases"
pos = 31

[[model]]
path = "machine/pipeline/rename.iml"
title = "Rename recovery: never guess"
pos = 6

[[model]]
path = "machine/pipeline/escalation.iml"
title = "Verify escalation ladder"
pos = 9

[[model]]
path = "machine/pipeline/verdict.iml"
title = "Verdict totality"
pos = 6

# Reference model: the trace and policy vocabulary. A layered, executable IML model of
# the trace/policy types and evaluator (read 01 to 09); the vocabulary the specs project
# to a wire format. Not checked by check.sh and not in the PO total.
[[reference_model]]
path = "trace-policy-model/"
title = "Trace and policy reference model"
paper = "sections 3 (trace format) and 6 (policies)"
conforms = "TRACE_SPEC and POLICY_SPEC (spec/)"
