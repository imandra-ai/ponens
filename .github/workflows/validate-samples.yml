name: Validate samples

# examples/ is the single source of truth for the demo traces (viewer dropdown,
# website, docs). Keep them honest: every sample must pass the CLI on each build.

on:
  pull_request:
    paths:
      - "examples/**"
      - "cli/**"
      - "spec/TRACE_SPEC_v*.md"        # a new spec makes every shipped trace out of date
      - ".github/workflows/validate-samples.yml"
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the CLI
        run: pip install -e ./cli

      - name: Validate + check every sample
        run: |
          set -e
          # An unmatched glob expands to ITSELF in bash, so a missing directory silently becomes a
          # filename and the error is `trace file not found: some/dir/*.json` - a path problem wearing
          # a data problem's clothes. `nullglob` makes an empty match empty, and the count below turns
          # "scanned nothing" into a failure rather than a pass.
          shopt -s nullglob
          fail=0
          seen=0
          # `examples/` only: `cli/ponens/demos/` is a BUILD COPY of it (cli/Makefile) and is gitignored,
          # so it does not exist in a checkout. Checking the source checks the copy by construction.
          for f in examples/*.json; do
            [ "$(basename "$f")" = "manifest.json" ] && continue
            seen=$((seen + 1))
            echo "::group::$f"
            ponens trace validate "$f" || fail=1
            # run the policy gate only when the trace declares policies
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('$f')).get('policies') else 1)"; then
              ponens trace check "$f" || fail=1
            fi
            ponens trace grade "$f" | head -1
            echo "::endgroup::"
          done
          if [ "$seen" -eq 0 ]; then
            echo "no samples found under examples/ - refusing to pass vacuously"
            exit 1
          fi
          echo "checked $seen sample(s)"
          exit $fail

      - name: Every shipped trace declares the published spec
        # Validity and currency are different questions. A 1.8 trace still VALIDATES against 1.13 -
        # the format is backward-compatible by design - and then grades `unranked` in every view that
        # reads the attribution block 1.12 added. The demo page showed exactly that for six versions.
        run: python3 cli/tools/check_demo_spec.py

      - name: Every shipped residual names the step that surfaced it
        # Also not validity: `introduced_by_action_id` is optional in the spec, so a residual without
        # one is well-formed and renders as `surfaced by: not recorded` on the demo page. Five of the
        # eight shipped residuals were in that state, on a page whose whole claim is attribution.
        run: python3 cli/tools/check_demo_provenance.py

      - name: Manifest entries all resolve
        run: |
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open("examples/manifest.json"))
          missing = [s["file"] for s in m["samples"]
                     if not os.path.exists(os.path.join("examples", s["file"]))]
          if missing:
              print("manifest references missing files:", missing); sys.exit(1)
          print(f"OK — {len(m['samples'])} manifest samples present")
          PY
