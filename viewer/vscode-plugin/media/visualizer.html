  .meta-card:hover { border-color: var(--accent, #6366f1); }
  .meta-head { display: flex; align-items: center; gap: 8px; }
  .meta-head .meta-id { font-family: 'SF Mono','Fira Code',monospace; font-size: 10px; color: var(--text-dim); flex: none; }
  .meta-head .meta-title { font-size: 13px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-status { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 8px; flex: none; }
  .meta-status.ok { background: rgba(34,197,94,.15); color: #86efac; }
  .meta-status.warn { background: rgba(234,179,8,.15); color: #fde047; }
  .meta-status.err { background: rgba(239,68,68,.15); color: #fca5a5; }
  .meta-source { font-size: 9px; padding: 1px 6px; border-radius: 8px; flex: none;
    background: var(--bg-inset, rgba(255,255,255,.06)); color: var(--text-dim); }
  .meta-source.plan_declared { background: rgba(99,102,241,.18); color: #c7d2fe; }
  .meta-gaps { font-size: 10px; color: #fbbf24; flex: none; }
  .meta-count { margin-left: auto; font-size: 10px; color: var(--text-dim); flex: none; }
  .meta-caret { font-size: 10px; color: var(--text-dim); flex: none; transition: transform .15s; }
  .meta-card.expanded .meta-caret { transform: rotate(90deg); }
  .meta-intent { font-size: 11px; color: var(--text-dim); line-height: 1.45; margin-top: 6px; }
  .meta-outcome { font-size: 11px; color: #86efac; line-height: 1.45; margin-top: 4px; }
  .meta-members { display: none; flex-direction: column; gap: 2px; margin-top: 10px;
    border-top: 1px solid var(--border, rgba(255,255,255,.08)); padding-top: 8px; }
  .meta-card.expanded .meta-members { display: flex; }
  .meta-member-row { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 3px 6px; border-radius: 4px; cursor: pointer; }
  .meta-member-row:hover { background: var(--bg-inset, rgba(255,255,255,.06)); }
  .meta-member-row .mr-id { color: var(--text-dim); font-family: 'SF Mono','Fira Code',monospace; font-size: 10px; flex: none; }
  .meta-member-row .mr-label { color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta-member-row .mr-result { margin-left: auto; font-family: 'SF Mono','Fira Code',monospace; font-size: 10px;
    color: #86efac; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; flex: none; }
  .meta-member-row .mr-result.err { color: #fca5a5; }
  .meta-caret { font-size: 13px; color: var(--text-dim); flex: none; }
  /* Drill-down breadcrumb when focused on one meta-action */
  .focus-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 8px 4px; margin-bottom: 4px; background: var(--bg-deep, #0b0f17); }
  .focus-back { font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer; flex: none;
    background: var(--accent, #6366f1); color: #fff; border: 1px solid var(--accent, #6366f1); }
  .focus-back:hover { filter: brightness(1.1); }
  .focus-title { font-size: 13px; font-weight: 600; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .focus-intent { font-size: 12px; color: var(--text-dim); line-height: 1.5; max-width: 760px; margin: 0 auto 4px; padding: 0 4px; }
  .focus-outcome { font-size: 12px; color: #86efac; line-height: 1.5; max-width: 760px; margin: 0 auto 10px; padding: 0 4px; }
  [data-theme="light"] .focus-outcome { color: #0a7a45; }
  .action-card .card-data { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .action-card .cd-tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .action-card .cd-in { background: #1a1a2e; color: #818cf8; border: 1px solid #2d2b55; }
  .action-card .cd-out { background: var(--bg-inset); color: #60a5fa; border: 1px solid #1e3a5f; }
  [data-theme="light"] .action-card .cd-in { background: #e4eaf4; color: #0c2340; border-color: #c0c8da; }
  [data-theme="light"] .action-card .cd-out { background: #e2ecf6; color: #0c2340; border-color: #bccce0; }

  .card-vgs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .card-vg-dot {
    font-size: 9px; padding: 1px 6px; border-radius: 3px; font-weight: 600; cursor: pointer;
  }
  .card-vg-dot.proved { background: #166534; color: #bbf7d0; }
  .card-vg-dot.sat { background: #1e3a5f; color: #93c5fd; }
  .card-vg-dot.refuted { background: #991b1b; color: #fecaca; }
  .card-vg-dot.unknown { background: #854d0e; color: #fef08a; }
  .card-vg-dot.pending { background: #374151; color: #d1d5db; }

  .action-card.gateway-card { border-color: #92400e; background: linear-gradient(135deg, var(--bg-surface) 60%, #271a0a); }
  .action-card.gateway-card:hover { border-color: #b45309; }
  .action-card.gateway-card .card-label { color: #fbbf24; }

  /* Reasoning cards */
  .action-card.reasoning-card { border-color: #5b21b6; background: linear-gradient(135deg, var(--bg-surface) 60%, #1a0a2e); }
  .action-card.reasoning-card:hover { border-color: #7c3aed; }
  .action-card.reasoning-card .card-label { color: #c4b5fd; }
  [data-theme="light"] .action-card.reasoning-card .card-label { color: #1e2860; }
  [data-theme="light"] .action-card.gateway-card .card-label { color: #4a3008; }

  /* Inline reasoning preview on cards */
  .card-reasoning-preview {
    margin-top: 6px; padding: 6px 8px; background: var(--bg-deep);
    border: 1px solid var(--border); border-radius: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 10px; line-height: 1.5; color: var(--text-muted);
    max-height: 48px; overflow: hidden;
    white-space: pre-wrap;
  }
  .card-reasoning-preview.iml { color: #c4b5fd; }
  .card-reasoning-preview.vg-src { color: #a5b4fc; }
  .card-reasoning-preview.result-proved { color: #86efac; }
  .card-reasoning-preview.result-sat { color: #93c5fd; }
  .card-reasoning-preview.result-refuted { color: #fca5a5; }

  .card-status-badge {
    display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 6px;
    border-radius: 3px; text-transform: uppercase; margin-top: 4px;
  }
  .card-status-badge.transparent { background: #166534; color: #bbf7d0; }
  .card-status-badge.proved { background: #166534; color: #bbf7d0; }
  .card-status-badge.sat { background: #1e3a5f; color: #93c5fd; }
  .card-status-badge.refuted { background: #991b1b; color: #fecaca; }

  .gw-options { margin-top: 6px; }
  .gw-opt { font-size: 11px; padding: 2px 0; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .gw-opt.chosen { color: #86efac; font-weight: 600; }
  .gw-opt .gw-bullet { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid var(--border-hover); }
  .gw-opt.chosen .gw-bullet { background: #86efac; border-color: #86efac; }

  .card-arrow { display: flex; align-items: center; color: var(--border); font-size: 16px; flex-shrink: 0; padding: 0 2px; }

  /* ---- Detail panel (right) ---- */
  .detail-panel {
    width: 420px; min-width: 280px; max-width: 70vw;
    background: var(--bg-surface);
    overflow-y: auto; padding: 20px; flex-shrink: 0;
  }
  .detail-panel h2 {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px;
  }
  .detail-panel h3 { font-size: 14px; font-weight: 600; color: var(--text-bright); margin-bottom: 6px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 3px; }
  .detail-section .label {
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px;
  }
  .dtag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--border); color: #7080c0; margin: 2px 2px 2px 0; font-family: 'SF Mono','Fira Code',monospace; }
  [data-theme="light"] .dtag { background: #e4eaf4; color: #0c2340; }
  .dtag-link:hover { text-decoration: underline; border-color: var(--accent); }
  .evidence-item { font-size: 12px; color: #a5b4fc; padding: 3px 0; }
  [data-theme="light"] .evidence-item { color: #0c2340; }

  /* Detail panel reasoning blocks */
  .dp-code-block {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px; line-height: 1.6; padding: 10px 12px;
    border-radius: 6px; margin: 6px 0; white-space: pre-wrap;
    overflow-x: auto; max-height: 200px; overflow-y: auto;
  }
  .dp-code-block.src { background: var(--bg-deep); color: var(--text-secondary); border: 1px solid var(--border); }
  .dp-code-block.iml { background: var(--bg-deep); color: #c4b5fd; border: 1px solid #2d2b55; }

  /* IML syntax highlighting tokens */
  .iml-kw { color: #c792ea; font-weight: 600; }          /* keywords: let, if, then, match, type, ... */
  .iml-kw-verify { color: #ff5370; font-weight: 700; }   /* verify, instance, theorem, lemma, axiom */
  .iml-type { color: #ffcb6b; }                           /* type constructors: Capitalized */
  .iml-fn { color: #82aaff; }                             /* function names after let */
  .iml-op { color: #89ddff; }                             /* operators: ==>, &&, ||, ->, ... */
  .iml-str { color: #c3e88d; }                            /* strings *)
  .iml-num { color: #f78c6c; }                            /* numbers */
  .iml-comment { color: #546e7a; font-style: italic; }    /* (* comments *) */
  .iml-bool { color: #f78c6c; font-weight: 600; }         /* true, false *)
  .iml-field { color: #f07178; }                           /* record field names *)
  .iml-attr { color: #546e7a; }                            /* [@@decomp ...] attributes */
  .iml-param { color: var(--text-primary); }                           /* parameters/variables */
  .iml-punc { color: #89ddff; }                            /* punctuation: ; | : *)
  .iml-module { color: #ffcb6b; font-weight: 600; }       /* Module.path */
  .dp-code-block.vg-src { background: var(--bg-deep); color: #a5b4fc; border: 1px solid #2d2b55; }
  .dp-code-block.proof { background: var(--bg-inset); color: #86efac; border: 1px solid #1e3a2e; }
  .dp-code-block.instance { background: var(--bg-inset); color: #93c5fd; border: 1px solid #1e3a5f; }
  .dp-code-block.test-code { background: var(--bg-inset); color: var(--text-primary); border: 1px solid #1e3a2e; }

  /* Python/TypeScript syntax highlighting tokens */
  .py-kw { color: #c792ea; font-weight: 600; }
  .py-builtin { color: #82aaff; }
  .py-fn { color: #82aaff; }
  .py-dec { color: #c792ea; font-style: italic; }
  .py-cls { color: #ffcb6b; }
  .py-str { color: #c3e88d; }
  .py-num { color: #f78c6c; }
  .py-bool { color: #f78c6c; font-weight: 600; }
  .py-comment { color: #546e7a; font-style: italic; }
  .py-op { color: #89ddff; }
  .py-self { color: #f07178; font-style: italic; }
  .py-param { color: var(--text-primary); }

  .ts-kw { color: #c792ea; font-weight: 600; }
  .ts-type { color: #ffcb6b; }
  .ts-fn { color: #82aaff; }
  .ts-str { color: #c3e88d; }
  .ts-num { color: #f78c6c; }
  .ts-bool { color: #f78c6c; font-weight: 600; }
  .ts-comment { color: #546e7a; font-style: italic; }
  .ts-op { color: #89ddff; }
  .ts-param { color: var(--text-primary); }

  .dp-status {
    display: inline-block; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 4px; text-transform: uppercase; margin-bottom: 6px;
  }
  .dp-status.transparent { background: #166534; color: #bbf7d0; }
  .dp-status.proved { background: #166534; color: #bbf7d0; }
  .dp-status.sat { background: #1e3a5f; color: #93c5fd; }
  .dp-status.refuted { background: #991b1b; color: #fecaca; }

  .dp-region-row {
    display: flex; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid var(--bg-deep); font-size: 11px; align-items: flex-start;
  }
  .dp-region-row:last-child { border-bottom: none; }
  .dp-region-idx { font-weight: 700; color: #a78bfa; font-family: 'SF Mono','Fira Code',monospace; width: 24px; flex-shrink: 0; }
  .dp-region-cons { font-family: 'SF Mono','Fira Code',monospace; color: var(--text-muted); flex: 1; }
  .dp-region-inv { font-family: 'SF Mono','Fira Code',monospace; color: #86efac; }
  .dp-region-wit { font-family: 'SF Mono','Fira Code',monospace; color: #fbbf24; font-size: 10px; }

  .dp-arrow-label {
    text-align: center; color: var(--border-hover); font-size: 11px; padding: 4px 0;
    font-family: 'SF Mono','Fira Code',monospace;
  }

  .dp-test-item {
    padding: 6px 0; border-bottom: 1px solid var(--bg-deep); cursor: pointer;
  }
  .dp-test-item:hover { background: rgba(99,102,241,0.04); margin: 0 -12px; padding: 6px 12px; border-radius: 4px; }
  .dp-test-name { font-family: 'SF Mono','Fira Code',monospace; font-size: 12px; color: var(--text-primary); }
  .dp-test-meta { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  /* Voronoi decomposition diagram */
  .voronoi-wrap {
    position: relative; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border); margin: 8px 0;
  }
  .voronoi-wrap canvas { display: block; width: 100%; height: auto; }
  .voronoi-labels {
    position: absolute; inset: 0; pointer-events: none;
  }
  .voronoi-label {
    position: absolute; pointer-events: auto; cursor: default;
    text-align: center; transition: opacity 0.15s;
  }
  .voronoi-label .vl-inv {
    font-family: 'SF Mono','Fira Code',monospace;
    font-size: 13px; font-weight: 700; color: var(--text-bright);
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }
  .voronoi-label .vl-cons {
    font-family: 'SF Mono','Fira Code',monospace;
    font-size: 10px; color: rgba(255,255,255,0.7);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    margin-top: 2px; line-height: 1.3;
  }
  .voronoi-label .vl-wit {
    font-family: 'SF Mono','Fira Code',monospace;
    font-size: 9px; color: rgba(251,191,36,0.85);
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    margin-top: 3px;
  }
  .voronoi-label .vl-idx {
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 4px rgba(0,0,0,0.7);
  }

  .voronoi-hierarchy {
    display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap;
  }
  .voronoi-hierarchy .vh-item { flex: 1; min-width: 200px; }
  .voronoi-hierarchy .vh-title {
    font-family: 'SF Mono','Fira Code',monospace;
    font-size: 12px; font-weight: 600; color: #c4b5fd;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .voronoi-hierarchy .vh-arrow {
    display: flex; align-items: center; justify-content: center;
    color: var(--border-hover); font-size: 20px; flex-shrink: 0; width: 30px;
    align-self: center;
  }

  /* Proof properties table */
  .proof-table {
    background: var(--bg-deep); border: 1px solid #1e3a2e; border-radius: 6px;
    overflow: hidden; margin: 6px 0;
  }
  .proof-hdr {
    display: flex; padding: 6px 10px; border-bottom: 1px solid #1e3a2e;
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .proof-hdr-icon { width: 24px; flex-shrink: 0; }
  .proof-hdr-name { flex: 1; }
  .proof-hdr-status { width: 70px; text-align: right; }
  .proof-row { border-bottom: 1px solid var(--bg-inset); cursor: pointer; }
  .proof-row:last-child { border-bottom: none; }
  .proof-row:hover { background: rgba(99,102,241,0.06); }
  .proof-row-main {
    display: flex; align-items: center; padding: 6px 10px;
  }
  .proof-row-icon { width: 24px; flex-shrink: 0; font-size: 14px; }
  .proof-row-name {
    flex: 1; font-family: 'SF Mono','Fira Code',monospace; font-size: 11px;
  }
  .proof-row-note { color: var(--text-dim); font-style: italic; margin-left: 6px; }
  .proof-row-badge {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px;
    text-transform: uppercase; flex-shrink: 0;
  }
  .proof-row-src {
    display: none;
    font-family: 'SF Mono','Fira Code',monospace; font-size: 11px;
    line-height: 1.6; padding: 8px 10px; margin: 0 10px 8px 34px;
    border-radius: 4px; background: var(--bg-elevated); border: 1px solid #2d2b55;
    white-space: pre-wrap;
  }
  .proof-row:hover .proof-row-src { display: block; }

  /* Top-level view switcher */
  .view-switcher {
    display: flex; gap: 4px; margin-left: 24px;
  }
  .view-switcher button {
    background: var(--bg-deep); color: var(--text-muted); border: 1px solid var(--border);
    padding: 4px 14px; border-radius: 4px; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .view-switcher button:hover { color: var(--text-primary); border-color: var(--border-hover); }
  .view-switcher button.active { color: var(--text-primary); background: #4f46e5; border-color: #4f46e5; }

  .top-view { display: none; height: calc(100vh - 90px); }
  .top-view.active { display: flex; }

  /* Lineage view */
  .lineage-view { overflow-y: auto; padding: 24px 32px; flex-direction: column; }

  .artifact-group {
    margin-bottom: 24px;
  }
  .artifact-group-header {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .artifact-group-header .ag-icon { font-size: 15px; }
  .artifact-group-header .ag-count {
    font-size: 10px; background: var(--border); color: var(--text-muted);
    padding: 1px 6px; border-radius: 8px;
  }

  .artifact-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 8px; overflow: hidden; transition: border-color 0.15s;
  }
  .artifact-card:hover { border-color: var(--border-hover); }

  .artifact-card-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer;
  }
  .artifact-card-header:hover { background: rgba(99,102,241,0.04); }
  .artifact-card-header .ac-icon { font-size: 16px; flex-shrink: 0; }
  .artifact-card-header .ac-label { font-size: 13px; color: var(--text-primary); font-weight: 500; flex: 1; }
  .artifact-card-header .ac-meta { font-size: 11px; color: var(--text-dim); }
  .artifact-card-header .ac-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; text-transform: uppercase;
  }
  .ac-badge.proved { background: #166534; color: #bbf7d0; }
  .ac-badge.refuted { background: #991b1b; color: #fecaca; }
  .ac-badge.sat { background: #1e3a5f; color: #93c5fd; }
  .ac-badge.transparent { background: #166534; color: #bbf7d0; }
  .artifact-card-header .ac-chevron { color: var(--border-hover); font-size: 12px; transition: transform 0.15s; }
  .artifact-card.expanded .ac-chevron { transform: rotate(90deg); }

  .artifact-card-body {
    display: none; border-top: 1px solid var(--border); padding: 16px;
  }
  .artifact-card.expanded .artifact-card-body { display: block; }

  .lineage-chain-title {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  /* Lineage tracing */
  .lineage-btn {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: #818cf8; cursor: pointer;
    padding: 4px 10px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg-deep); margin-top: 8px; transition: all 0.15s;
  }
  .lineage-btn:hover { background: var(--bg-surface); border-color: #818cf8; }

  .lineage-chain { margin-top: 10px; }
  .lineage-step {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 4px; cursor: pointer;
    transition: all 0.15s; font-size: 12px;
  }
  .lineage-step:hover { border-color: var(--border-hover); background: var(--bg-elevated); }
  .lineage-step.current { border-color: #818cf8; background: #1e1b4b; }
  [data-theme="light"] .lineage-step.current { border-color: var(--accent); background: #e6f2fa; }
  .lineage-step .ls-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .lineage-step .ls-id {
    font-size: 9px; font-weight: 700; color: var(--border-hover);
    background: var(--bg-surface); padding: 1px 4px; border-radius: 2px;
    flex-shrink: 0; margin-top: 2px;
  }

  /* ==============================================================
     MODAL OVERLAY
     ============================================================== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(2,6,23,0.7); backdrop-filter: blur(4px);

  .modal {

  .mvg-kind {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    background: var(--bg-surface); padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .mvg-desc { font-size: 13px; color: var(--text-primary); flex: 1; }

  .mvg-chevron { color: var(--border-hover); font-size: 12px; transition: transform 0.15s; }

  .mvg-body {

  .mvg-src {

  .mvg-proof {
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: #86efac;

  /* Decomp inside modal */

  .r-idx { font-weight: 700; color: #a78bfa; font-family: 'SF Mono', 'Fira Code', monospace; }
  .r-cons { font-family: 'SF Mono', 'Fira Code', monospace; color: var(--text-muted); font-size: 11px; line-height: 1.6; }
  .r-inv { font-family: 'SF Mono', 'Fira Code', monospace; color: #86efac; }

  [data-theme="light"] .r-inv { color: #085a38; }
  [data-theme="light"] .r-wit { color: #5a4508; }

  /* Formalization inside modal */
  .mformal-status {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  }
  .mformal-status .status-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; text-transform: uppercase;
  }
  .status-badge.transparent { background: #166534; color: #fff; text-transform: uppercase; }

  .mformal-panes { display: flex; gap: 16px; margin-bottom: 16px; }

  }
  .mformal-pane-body {
    padding: 14px; font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px; line-height: 1.7; white-space: pre-wrap; max-height: 300px; overflow-y: auto;
  }

  .mformal-pane-body.iml { color: #c4b5fd; }
  .mformal-arrow {
    display: flex; align-items: center; justify-content: center;
    width: 40px; flex-shrink: 0; color: var(--border-hover); font-size: 22px;
  }
  .mformal-syms { font-size: 12px; color: var(--text-dim); }
  .mformal-syms span { color: #c4b5fd; font-family: 'SF Mono','Fira Code', monospace; }
  [data-theme="light"] .mformal-syms span { color: #5040a0; }
  [data-theme="light"] .mformal-arrow { color: var(--text-muted); }
  [data-theme="light"] .mformal-pane-body.iml { color: #4030a0; }


  /* Light theme Voronoi labels */
  [data-theme="light"] .voronoi-label .vl-idx {
    color: rgba(0,0,0,0.8);
    text-shadow: 0 1px 3px rgba(255,255,255,0.7);

    color: #0c2340;
    text-shadow: 0 1px 3px rgba(255,255,255,0.7);
  }
  [data-theme="light"] .voronoi-label .vl-cons {
    color: rgba(0,0,0,0.6);
    text-shadow: 0 1px 3px rgba(255,255,255,0.7);
  }

    color: #5a4508;
    text-shadow: 0 1px 3px rgba(255,255,255,0.7);
  }

  /* Light theme fixes for remaining pastel colors */

  [data-theme="light"] .mvg-proof { color: #085a38; }
  [data-theme="light"] .mvg-instance { color: #084880; }
  [data-theme="light"] .mdec-fn { color: #302090; }
  [data-theme="light"] .mtest-group-hdr { color: #302090; }
  [data-theme="light"] .mtest-region { color: #302090; background: var(--bg-inset); }
  [data-theme="light"] .mformal-syms span { color: #302090; }
  [data-theme="light"] .mformal-pane-body.iml { color: #1e3a56; }

  /* Semantic color utilities — theme-aware for inline-styled JS content */
  .clr-purple { color: #c4b5fd; }
  .clr-indigo { color: #818cf8; }
  .clr-blue { color: #93c5fd; }
  .clr-green { color: #86efac; }
  .clr-red { color: #fca5a5; }
  .clr-yellow { color: #fef08a; }
  [data-theme="light"] .clr-purple { color: #302090; }
  [data-theme="light"] .clr-indigo { color: #0c2340; }
  [data-theme="light"] .clr-blue { color: #084880; }
  [data-theme="light"] .clr-green { color: #085a38; }
  [data-theme="light"] .clr-red { color: #8a1520; }
  [data-theme="light"] .clr-yellow { color: #5a4508; }
  /* Light-mode contrast for the step/meta result + outcome text (green/red on white) */

  [data-theme="light"] .step-subrow .sr-result,
  [data-theme="light"] .meta-outcome { color: #0a7a45; }
  [data-theme="light"] .meta-member-row .mr-result.err,
  [data-theme="light"] .step-subrow .sr-result.err { color: #b91c1c; }
  [data-theme="light"] .meta-status.ok { background: rgba(21,128,61,.12); color: #15803d; }
  [data-theme="light"] .meta-status.warn { background: rgba(161,98,7,.14); color: #a16207; }
  [data-theme="light"] .meta-status.err { background: rgba(185,28,28,.12); color: #b91c1c; }

  .proof-row-badge.status-proved { background: #166534; color: #bbf7d0; }
  .proof-row-badge.status-pending { background: #854d0e; color: #fef08a; }
  .proof-row-badge.status-refuted { background: #991b1b; color: #fecaca; }
  .proof-row-badge.status-unknown { background: #854d0e; color: #fef08a; }
  [data-theme="light"] .proof-row-badge.status-proved { background: #0a7a4a; color: #fff; }
  [data-theme="light"] .proof-row-badge.status-pending { background: #7a6010; color: #fff; }
  [data-theme="light"] .proof-row-badge.status-refuted { background: #b82030; color: #fff; }
  [data-theme="light"] .proof-row-badge.status-unknown { background: #7a6010; color: #fff; }

  .prop-tag-pending { background: #1a1a0a; border: 1px solid #854d0e; color: #fbbf24; }
  .prop-tag-proved { background: #0a1a0a; border: 1px solid #166534; color: #86efac; }
  .prop-tag-refuted { background: #1a0a0a; border: 1px solid #991b1b; color: #fca5a5; }
  [data-theme="light"] .prop-tag-pending { background: #faf3dc; border-color: #c8a030; color: #5a4508; }
  [data-theme="light"] .prop-tag-proved { background: #e6f5ee; border-color: #0a7a4a; color: #085a38; }
  [data-theme="light"] .prop-tag-refuted { background: #fde8ea; border-color: #b82030; color: #8a1520; }

  /* Tests inside modal */
  .mtest-group { margin-bottom: 16px; }
  .mtest-group-hdr {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px; font-weight: 600; color: #c4b5fd; margin-bottom: 4px;
  }
  .mtest-group-lang { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .mtest-card {
    background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-bottom: 8px;
  }
  .mtest-header {
    padding: 8px 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;
  }
  .mtest-header:hover { background: rgba(99,102,241,0.04); }
  .mtest-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--text-primary); }
  .mtest-region { font-size: 10px; color: #a78bfa; background: var(--bg-surface); padding: 2px 6px; border-radius: 4px; margin-left: auto; }
  .mtest-chevron { color: var(--border-hover); font-size: 12px; transition: transform 0.15s; }
  .mtest-card.expanded .mtest-chevron { transform: rotate(90deg); }
  .mtest-body { display: none; border-top: 1px solid var(--border); }
  .mtest-card.expanded .mtest-body { display: block; }
  .mtest-cons {
    padding: 6px 14px; font-size: 10px; font-family: 'SF Mono', 'Fira Code', monospace;

  .mtest-io { padding: 6px 14px; display: flex; gap: 20px; font-size: 11px; }
  .mtest-io .lbl { color: var(--text-dim); font-size: 9px; text-transform: uppercase; margin-bottom: 1px; }
  .mtest-io .val { font-family: 'SF Mono', 'Fira Code', monospace; color: #fbbf24; }
  .mtest-code {
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; color: var(--text-primary);
    background: var(--bg-inset); padding: 10px 14px; line-height: 1.6; white-space: pre-wrap;

  /* Properties inside modal */
  .mprop-summary { margin-bottom: 14px; font-size: 14px; font-weight: 600; }
  .mprop-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 6px;

  /* ---- Drop zone ---- */
  .file-drop-zone {
    display: none; position: fixed; inset: 0;
    background: rgba(15,23,42,0.85); z-index: 100;
    justify-content: center; align-items: center;

    border: 3px dashed var(--border-hover); margin: 20px; border-radius: 12px;
  }
  .file-drop-zone.visible { display: flex; }

  /* ---- Scrollbar ---- */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

  /* ---- v1.1: result summary on cards ---- */
  .card-result-summary {
    font-size: 10px; color: var(--text-muted); margin-top: 4px;
    font-family: 'SF Mono', 'Fira Code', monospace;
    padding: 2px 6px; background: var(--bg-deep); border-radius: 3px;
    border: 1px solid var(--bg-surface);
  }

  /* ---- v1.1: execution metadata in detail panel ---- */
  .dp-exec-meta {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  }
  .dp-exec-meta span {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', monospace;
  }

  /* ---- v1.1: gateway rejected_because ---- */
  .gw-opt-reason {
    font-size: 10px; color: var(--text-dim); font-style: italic; margin-left: 4px;
  }

  /* ---- v1.1: observations in detail panel ---- */
  .dp-observation {
    padding: 6px 10px; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 6px;
  }
  .dp-observation p { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
  .dp-obs-confidence {
    font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
    background: var(--bg-surface); color: var(--text-muted); text-transform: uppercase; margin-top: 4px;
    display: inline-block;
  }

  /* ---- v1.1: policies modal ---- */
  .mpolicy-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 6px; margin-bottom: 6px;

  .mpolicy-name { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: var(--text-primary); }
  .mpolicy-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .mpolicy-severity.warning { background: #854d0e; color: #fef08a; }
  .mpolicy-severity.info { background: #1e3a5f; color: #93c5fd; }
  .mpolicy-note { font-size: 10px; color: var(--text-dim); font-style: italic; margin-top: 4px; }

  /* ---- Artifact DAG view ---- */
  .dag-view { overflow: hidden; padding: 0; flex-direction: column; position: relative; }
  .dag-canvas-wrap {
    position: absolute; inset: 0;
    background: var(--bg-elevated); overflow: hidden; cursor: grab;
  }
  .dag-canvas-wrap.dragging { cursor: grabbing; }
  .dag-inner {
    position: absolute; transform-origin: 0 0;
  }
  .dag-canvas-wrap canvas { display: block; }
  .dag-node-labels { position: absolute; inset: 0; pointer-events: none; }
  .dag-node {
    position: absolute; pointer-events: auto; cursor: grab;
    text-align: center; transition: all 0.15s;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px; border: 2px solid transparent;
    padding: 6px 10px; min-width: 80px;
  }
  .dag-node:hover { transform: scale(1.08); z-index: 10; }
  /* While being dragged: follow the cursor with no transition/hover-scale offsetting the position. */
  .dag-node.dragging { cursor: grabbing; transition: none; transform: none; z-index: 20;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  /* Residual group container: a distinct rectangle. Collapsed = one node-sized box; expanded = a
     dashed cluster whose member residual nodes render inside it. Double-click toggles. */
  .dag-group { position: absolute; pointer-events: auto; border: 2px dashed; border-radius: 10px;
    cursor: pointer; }
  .dag-group.collapsed { display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 6px 10px; transition: transform 0.15s; }
  .dag-group.collapsed:hover { transform: scale(1.05); z-index: 10; }
  .dag-group.expanded { z-index: 0; }
  .dag-group.expanded .dag-group-header { position: absolute; top: 0; left: 0; right: 0; height: 30px;
    display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; }
  .dag-node.selected { border-color: #818cf8; box-shadow: 0 0 12px rgba(129,140,248,0.4); }
  .dag-node.superseded { opacity: 0.45; }
  /* Node isolation: select a node → dim everything NOT in its connected lineage subgraph. */
  .dag-inner.isolating .dag-node { transition: opacity 0.15s; }
  .dag-node.dag-dim { opacity: 0.1; pointer-events: none; }
  .dag-edge { transition: opacity 0.15s; }
  .dag-edge.dag-dim { opacity: 0.05 !important; }
  /* Type filter (from the graph's type chips): dim artifacts whose type is toggled off. */
  .dag-node.dag-type-dim { opacity: 0.12; transition: opacity 0.15s; }
  .dag-edge.dag-type-dim { opacity: 0.06 !important; transition: opacity 0.15s; }
  .dag-node .dn-type {
    font-size: 8px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 1px 5px; border-radius: 3px; margin-bottom: 3px;
  }
  .dag-node .dn-name {
    font-size: 11px; font-weight: 600; color: var(--text-primary);
    font-family: 'SF Mono','Fira Code',monospace;
    max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dag-node .dn-rev { font-size: 9px; color: var(--text-dim); }
  .dag-node .dn-summary {
    font-size: 9px; color: var(--text-muted); max-width: 130px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
  }

  .dag-controls {
    position: absolute; bottom: 16px; left: 16px; z-index: 20;
    display: flex; gap: 4px; pointer-events: auto;
  }
  .dag-controls button {
    background: var(--bg-surface); border: 1px solid var(--border); color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 6px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .dag-controls button:hover { background: var(--border); color: var(--text-primary); }

  .dag-legend {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    background: var(--bg-deep)cc; backdrop-filter: blur(8px);
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  }

  .dag-detail {
    position: absolute; right: 16px; top: 16px; width: 300px; z-index: 20;
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; pointer-events: auto; max-height: calc(100% - 32px); overflow-y: auto;
  }
  .dag-detail h3 { font-size: 14px; color: var(--text-bright); margin-bottom: 8px; }
  .dag-detail .dd-field {
    font-size: 11px; color: var(--text-muted); margin-bottom: 4px;
  }
  .dag-detail .dd-field span { color: var(--text-primary); }
  .dag-detail .dd-label {
    font-size: 10px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em; margin-top: 10px; margin-bottom: 4px;
  }
  .dag-detail .mono { font-family: ui-monospace, 'SF Mono', monospace; }
  /* Verdict chip in the artifact detail. */
  .dd-verdict { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    border-radius: 5px; padding: 1px 7px; }
  .dd-v-proved, .dd-v-sat { background: var(--green-dim); color: var(--green-text); }
  .dd-v-refuted { background: var(--red-dim); color: var(--red-text); }
  .dd-v-unknown, .dd-v-pending { background: var(--yellow-dim); color: var(--yellow-text); }
  /* Counterexample field→value table (ported from desktop Counterexample.tsx). */
  .ce-table { width: 100%; border-collapse: collapse; font-size: 11px; margin: 2px 0 4px; }
  .ce-tr { border-bottom: 1px solid var(--border); }
  .ce-key { color: var(--text-muted); padding: 3px 8px 3px 0; vertical-align: top; white-space: nowrap; }
  .ce-key-field { padding-left: 14px; }
  .ce-value { color: var(--text-primary); padding: 3px 0; word-break: break-all; }
  .ce-value.mono, .ce-key { font-family: ui-monospace, 'SF Mono', monospace; }
  .ce-brace { color: var(--text-dim); }
  .ce-raw { margin-top: 6px; }
  .ce-raw summary { font-size: 10px; color: var(--accent); cursor: pointer; }
  .ad-pre { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 11px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; margin: 4px 0 0; color: var(--text-primary); }
  /* Decomposition regions (edge cases) in the artifact detail. */
  .rg-list { display: flex; flex-direction: column; gap: 6px; }
  .rg-cell { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--bg-deep); }
  .rg-head { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
  .rg-inv { font-size: 11px; color: var(--text-primary); margin-bottom: 3px; word-break: break-word; }
  .rg-cons { margin: 0; padding-left: 14px; }
  .rg-cons li { font-size: 11px; color: var(--text-muted); word-break: break-word; }
  .rmap-open-btn { font: inherit; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 5px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg-deep); cursor: pointer; }
  /* Interactive region map (treemap) modal — ported from the desktop/extension visualizer. */
  /* Region map — themed via the viewer's CSS variables so it follows dark/light like the rest. The
     treemap tiles keep their own mint→teal palette + dark labels (readable on either background). */
  .rmap-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(10,12,16,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .rmap-modal { background: var(--bg-surface); color: var(--text); border-radius: 12px; width: min(1200px, 96vw);
    height: min(800px, 92vh); display: flex; flex-direction: column; padding: 16px; box-shadow: 0 24px 60px -20px rgba(0,0,0,0.6); }
  /* Embedded in a host pane: fill it, no backdrop/card chrome, no close (it's the whole view). */
  .rmap-overlay.rmap-embedded { position: absolute; padding: 0; background: var(--bg-surface); }
  .rmap-embedded .rmap-modal { width: 100%; height: 100%; max-width: none; max-height: none; border-radius: 0; box-shadow: none; }
  .rmap-embedded .rmap-close { display: none; }
  .rmap-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rmap-title { font-size: 15px; font-weight: 700; color: var(--accent); }
  .rmap-close { border: 1px solid var(--border); background: var(--bg-inset); color: var(--text-muted); border-radius: 6px;
    width: 28px; height: 28px; cursor: pointer; font-size: 14px; }
  .rmap-close:hover { color: var(--text); border-color: var(--text-dim); }
  .rmap-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 10px;
    font: 12px ui-monospace, Menlo, monospace; }
  .rmap-crumb { cursor: pointer; color: var(--accent); padding: 2px 7px; border-radius: 5px; background: var(--bg-inset); border: 1px solid var(--border); }
  .rmap-crumb:hover { background: var(--bg-surface); }
  .rmap-crumb.cur { color: #fff; background: var(--accent); border-color: var(--accent); cursor: default; }
  .rmap-sep { color: var(--text-dim); }
  .rmap-body { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .rmap-chart { flex: 1; min-width: 0; height: 100%; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 8px; }
  .rmap-detail { width: 320px; flex: none; overflow: auto; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px; }
  .rmap-detail h3 { font-size: 13px; font-weight: 700; color: var(--accent); margin: 0 0 10px; }
  .rmap-counts { color: var(--accent); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .rmap-sec { color: var(--accent); font-weight: 700; font-size: 12px; margin: 12px 0 4px; }
  .rmap-hint { color: var(--text-muted); font-size: 12px; }
  .rmap-hintlist { color: var(--text-muted); font-size: 12px; margin: 4px 0; padding-left: 18px; }
  .rmap-hintlist li { font-family: ui-monospace, Menlo, monospace; margin: 3px 0; }
  .rmap-detail pre { margin: 4px 0 12px; padding: 8px 10px; background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .rmap-table-wrap { margin-top: 10px; max-height: 30%; overflow: auto; }
  .rmap-table-wrap > summary { cursor: pointer; font-size: 12px; color: var(--accent); padding: 4px 0; }
  .rmap-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
  .rmap-table th { text-align: left; color: var(--text-muted); font-weight: 600; padding: 4px 8px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-inset); }
  .rmap-table td { padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  .rmap-table .rmt-lbl { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .rmap-table .mono { font-family: ui-monospace, Menlo, monospace; }
  /* Verification page (goals table + IML gutter + source) — reuses the rmap-modal shell, themed. */
  .vp-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .vp-goals { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; }
  .vp-goals th { text-align: left; padding: 8px 12px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); background: var(--bg-inset); }
  .vp-goals td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
  .vp-goals .vp-prop { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .vp-vb { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .vp-vb.proved { color: var(--green-text); background: var(--green-dim); }
  .vp-vb.refuted { color: var(--red-text); background: var(--red-dim); }
  .vp-vb.unknown, .vp-vb.failed { color: var(--yellow-text); background: var(--yellow-dim); }
  .vp-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
  .vp-empty { color: var(--text-muted); font-style: italic; padding: 8px; }
  .vp-scroll { max-height: 480px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-deep); }
  .vp-gutter { border-collapse: collapse; width: 100%; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .vp-gutter td { padding: 0 8px; vertical-align: top; white-space: pre; }
  .vp-gutter td.vp-gmark { width: 22px; text-align: center; user-select: none; font-weight: 700; }
  .vp-gutter td.vp-gmark.proved { color: var(--green-text); }
  .vp-gutter td.vp-gmark.refuted { color: var(--red-text); }
  .vp-gutter td.vp-gmark.unknown, .vp-gutter td.vp-gmark.failed { color: var(--yellow-text); }
  .vp-gutter td.vp-gnum { width: 30px; text-align: right; color: var(--text-dim); user-select: none; }
  .vp-gutter td.vp-gcode { width: 100%; color: var(--text); }
  .vp-gutter tr:hover td { background: var(--bg-inset); }
  .vp-pre { margin: 0; padding: 10px; white-space: pre-wrap; word-break: break-word; tab-size: 2;
    font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg-deep); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); max-height: 360px; overflow: auto; }

  /* ---- Residual individual view (openResidual) ---- */
  .rp-body { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 2px; }
  .rp-badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .rp-chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    border: 1px solid; border-radius: 6px; padding: 2px 8px; }
  .rp-stmt { font-size: 16px; line-height: 1.5; color: var(--text); }
  .rp-sec { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin-bottom: -6px; }
  .rp-check, .rp-field { font-size: 13px; line-height: 1.55; color: var(--text-secondary);
    border-left: 2px solid var(--border); padding: 2px 0 2px 12px; }
  .rp-anchors { display: flex; flex-wrap: wrap; gap: 8px; }
  .rp-anchor { font-size: 12px; font-family: ui-monospace, Menlo, monospace; color: var(--text);
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .rp-anchor:hover { border-color: var(--accent); }
  .rp-anchor-static { cursor: default; }
  .rp-meta { font-size: 11px; color: var(--text-dim); }

  /* ---- Reasoning Funnel view ---- */
  .funnel-view { overflow: auto; padding: 32px; flex-direction: column; }
  .funnel-stages {
    display: flex; align-items: flex-end; gap: 0; justify-content: center;
    margin-bottom: 32px; min-height: 200px;
  }
  .funnel-stage {
    display: flex; flex-direction: column; align-items: center;
    position: relative;
  }
  .funnel-bar-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 200px; position: relative;
  }
  .funnel-bar {
    width: 100px; border-radius: 6px 6px 0 0;
    transition: all 0.3s; position: relative; min-height: 4px;
  }
  .funnel-bar:hover { filter: brightness(1.2); }
  .funnel-count {
    font-size: 20px; font-weight: 700; color: var(--text-bright);
    position: absolute; top: -28px; left: 50%; transform: translateX(-50%);
  }
  .funnel-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-align: center; margin-top: 10px; max-width: 110px;
  }
  .funnel-arrow {
    display: flex; align-items: center; color: var(--border); font-size: 24px;
    padding: 0 6px; align-self: center; margin-bottom: 30px;
  }
  .funnel-breakdown {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  }
  .funnel-breakdown-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 18px; min-width: 180px; flex: 1; max-width: 280px;
  }
  .funnel-breakdown-card h4 {
    font-size: 12px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px;
  }
  .fb-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; }
  .fb-row .fb-icon { font-size: 14px; width: 18px; text-align: center; }
  .fb-row .fb-label { color: var(--text-primary); flex: 1; }
  .fb-row .fb-count { color: var(--text-muted); font-family: 'SF Mono','Fira Code',monospace; font-weight: 600; }

  /* ---- Policy Dashboard view ---- */
  .policy-view { overflow: auto; padding: 32px; flex-direction: column; }
  .policy-summary-bar {
    display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .policy-stat {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 24px; text-align: center; min-width: 120px; flex: 1;
  }
  .policy-stat .ps-num { font-size: 28px; font-weight: 700; }
  .policy-stat .ps-label { font-size: 11px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  .policy-group { margin-bottom: 20px; }
  .policy-group-header {
    font-size: 11px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .policy-group-header .pg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .policy-card {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 6px; display: flex; align-items: flex-start; gap: 12px;
    transition: border-color 0.15s;
  }
  .policy-card:hover { border-color: var(--border-hover); }
  .policy-card .pc-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .policy-card .pc-body { flex: 1; min-width: 0; }
  .policy-card .pc-name {
    font-size: 13px; font-weight: 600; color: var(--text-primary);
    font-family: 'SF Mono','Fira Code',monospace;
    /* long snake_case names must wrap, not overflow UNDER the status badge in a narrow pane */
    overflow-wrap: anywhere; min-width: 0;
  }
  .policy-card .pc-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .policy-card .pc-meta { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
  .policy-card .pc-meta-item { display: inline-flex; align-items: center; gap: 5px; }
  .policy-card .pc-meta-label { font-size: 9px; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em; }
  .policy-card .pc-tag {
    font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 3px;
    text-transform: uppercase; cursor: help; position: relative;
  }
  /* Fast, formatted tooltip (native `title` has an untunable ~2s delay). Appears ~120ms after hover. */
  .policy-card .pc-tip {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 50;
    width: max-content; max-width: 320px;
    background: var(--bg-deep); color: var(--text-secondary); border: 1px solid var(--border);
    border-radius: 7px; padding: 9px 11px; text-align: left;
    text-transform: none; letter-spacing: 0; font-weight: 400;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0; transform: translateY(-3px); pointer-events: none; visibility: hidden;
    transition: opacity 0.1s ease, transform 0.1s ease; transition-delay: 0.12s;
  }
  .policy-card .pc-tag:hover .pc-tip { opacity: 1; transform: translateY(0); visibility: visible; }
  .pc-tip .pc-tip-noun { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 3px; }
  .pc-tip .pc-tip-head { display: block; font-size: 12px; line-height: 1.45; color: var(--text); }
  .pc-tip .pc-tip-sub { display: block; margin: 9px 0 4px; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .pc-tip .pc-tip-li { display: block; position: relative; padding-left: 13px; font-size: 11.5px;
    line-height: 1.5; margin: 2px 0; }
  .pc-tip .pc-tip-li::before { content: '•'; position: absolute; left: 2px; color: var(--text-dim); }
  .pc-tip b { color: var(--text); font-weight: 700; }
  .pc-tag.scope { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border); }
  .pc-tag.kind { background: var(--bg-surface); color: #818cf8; border: 1px solid #2d2b55; }
  .policy-card .pc-note { font-size: 10px; color: var(--text-dim); font-style: italic; margin-top: 4px; }
  .policy-card .pc-evidence {
    font-size: 10px; color: #818cf8; margin-top: 4px;
    font-family: 'SF Mono','Fira Code',monospace;
  }
  /* Clickable citation inside a policy evidence/violation line — links to the action/artifact. */
  .policy-card .pc-evidence .pc-link { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .policy-card .pc-evidence .pc-link:hover { filter: brightness(1.25); }

  .pc-status-badge {
    font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 4px;
    text-transform: uppercase; flex-shrink: 0;
  }
  .pc-status-badge.passed { background: #166534; color: #bbf7d0; }
  .pc-status-badge.failed { background: #991b1b; color: #fecaca; }
  .pc-status-badge.unknown { background: #854d0e; color: #fef08a; }
  .pc-status-badge.not_applicable { background: var(--border); color: var(--text-muted); }

  /* ---- Policy definition expandable ---- */
  /* Policy definition (formula) is always shown — the formulas are compact, no expand/collapse. */
  .pc-definition {
    display: block; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .pc-def-section {
    margin-bottom: 10px;
  }
  .pc-def-label {
    font-size: 9px; font-weight: 700; color: var(--border-hover);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }
  .pc-selector-table {
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .pc-selector-chip {
    font-size: 10px; padding: 2px 8px; border-radius: 4px;
    font-family: 'SF Mono','Fira Code',monospace;
    background: var(--bg-deep); border: 1px solid var(--border); color: var(--text-primary);
  }
  .pc-selector-chip .sc-key { color: var(--text-dim); }
  .pc-selector-chip .sc-val { color: #93c5fd; }

  .pc-rule-block {
    background: var(--bg-deep); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: 'SF Mono','Fira Code',monospace;
    font-size: 13px; line-height: 1.6;
  }
  .ltl-op { color: #c792ea; font-weight: 700; }
  .ltl-prop { color: #82aaff; }
  .ltl-pred { color: #ffcb6b; }
